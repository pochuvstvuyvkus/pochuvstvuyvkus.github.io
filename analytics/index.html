<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1e293b">
  <title>Аналитика лидов · Общество красивых волос</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar: #1e293b; --sidebar-hover: #334155; --sidebar-active: #475569;
      --sidebar-text: #94a3b8; --sidebar-text-active: #f8fafc;
      --bg: #f4f5f7; --surface: #fff; --surface-2: #fafbfc; --line: #e8eaed; --line-soft: #f0f1f3;
      --text: #111827; --text-2: #374151; --muted: #6b7280; --muted-2: #9ca3af;
      --brand: #3d5a80; --brand-hover: #2d4a6f; --brand-soft: #eef2f7; --base: #a9bfd9;
      --green: #0d9f6e; --green-soft: #e8f8f1; --red: #dc2626; --red-soft: #fef2f2;
      --amber: #d97706; --amber-soft: #fffbeb;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.05); --shadow: 0 8px 30px rgba(16,24,40,.06);
      --radius: 14px; --radius-lg: 18px; --sidebar-w: 248px;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font: 14px/1.5 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button { font: inherit; }

    /* layout */
    .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--sidebar); color: var(--sidebar-text); padding: 20px 14px;
      display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 22px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 11px; background: #334155; color: #f8fafc;
      display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.02em; flex: none;
    }
    .brand-name { color: #f8fafc; font-weight: 700; line-height: 1.25; }
    .brand-sub { font-size: 12px; }
    .nav-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 6px; color: #64748b; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px;
      background: transparent; color: var(--sidebar-text); text-align: left; cursor: pointer; transition: background .15s, color .15s;
    }
    .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
    .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .nav-count { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; color: #64748b; }
    .nav-item.active .nav-count { color: #cbd5e1; }
    .sidebar-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid #334155; font-size: 12px; }
    .logout { background: none; border: 0; color: var(--sidebar-text); cursor: pointer; padding: 6px 0; }
    .logout:hover { color: #f8fafc; }

    .main { min-width: 0; width: 100%; max-width: 1480px; margin: 0 auto; padding: 28px 32px 48px; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin: 0; }
    .subtitle { color: var(--muted); margin-top: 2px; }
    .periods { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .segmented { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; box-shadow: var(--shadow-sm); }
    .segmented button {
      border: 0; background: transparent; color: var(--text-2); padding: 7px 12px; border-radius: 9px;
      cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s;
    }
    .segmented button:hover { background: var(--brand-soft); }
    .segmented button.active { background: var(--brand); color: #fff; }
    .range { position: relative; }
    .dates {
      display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm); color: var(--text-2);
      font-weight: 500; cursor: pointer; white-space: nowrap; transition: border-color .15s, box-shadow .15s;
    }
    .dates:hover { border-color: #cbd5e1; }
    .dates.open, .dates.custom { border-color: var(--brand); }
    .dates.open { box-shadow: 0 0 0 3px var(--brand-soft); }
    .dates svg { flex: none; color: var(--muted); }
    .dates .chevron { transition: transform .15s; }
    .dates.open .chevron { transform: rotate(180deg); }

    /* our own calendar: a dropdown on desktop, a bottom sheet on phones */
    .picker {
      position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; background: var(--surface);
      border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 64px rgba(16,24,40,.16);
      padding: 16px; width: max-content; animation: pop .14s ease-out;
    }
    .picker[hidden], .backdrop[hidden] { display: none; }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
    .picker-body { position: relative; }
    .picker-months { display: flex; gap: 28px; }
    .month { width: 252px; }
    .month-title { text-align: center; font-weight: 700; height: 32px; line-height: 32px; margin-bottom: 6px; text-transform: capitalize; }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 36px); }
    .weekdays span { font-size: 11px; font-weight: 600; color: var(--muted-2); text-align: center; text-transform: uppercase; padding: 4px 0 6px; }
    .day {
      height: 36px; border: 0; background: transparent; border-radius: 10px; font: inherit; color: var(--text);
      cursor: pointer; font-variant-numeric: tabular-nums; transition: background .1s;
    }
    .day:hover { background: var(--brand-soft); }
    .day.in-range { background: var(--brand-soft); border-radius: 0; }
    .day.start, .day.end { background: var(--brand); color: #fff; }
    .day.start { border-radius: 10px 0 0 10px; }
    .day.end { border-radius: 0 10px 10px 0; }
    .day.start.end { border-radius: 10px; }
    .day.today:not(.start):not(.end) { box-shadow: inset 0 0 0 1.5px var(--brand); }
    .day:disabled { color: #d1d5db; cursor: default; background: transparent; box-shadow: none; }
    .day.blank { visibility: hidden; }
    .picker-nav {
      position: absolute; top: 0; width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text-2); cursor: pointer; display: grid; place-items: center;
    }
    .picker-nav:hover:not(:disabled) { background: var(--brand-soft); }
    .picker-nav:disabled { opacity: .35; cursor: default; }
    .picker-nav.prev { left: 0; }
    .picker-nav.next { right: 0; }
    .picker-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft);
    }
    .picker-range { font-weight: 600; color: var(--text-2); }
    .picker-range.error { color: var(--red); }
    .picker-actions { display: flex; gap: 8px; margin-left: auto; }
    .btn {
      height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
      color: var(--text-2); cursor: pointer; font-weight: 600; transition: background .15s, border-color .15s;
    }
    .btn:hover { background: var(--surface-2); border-color: #cbd5e1; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.primary:hover { background: var(--brand-hover); }
    .btn.primary:disabled { opacity: .45; cursor: default; }
    .backdrop { position: fixed; inset: 0; background: rgba(17,24,39,.38); z-index: 25; animation: fade .15s ease-out; display: none; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes sheet { from { transform: translateY(100%); } }

    .search-wrap { position: relative; display: inline-flex; align-items: center; }
    .search-clear {
      position: absolute; right: 6px; width: 26px; height: 26px; border: 0; border-radius: 8px; background: transparent;
      color: var(--muted-2); cursor: pointer; display: grid; place-items: center;
    }
    .search-clear:hover { background: var(--line-soft); color: var(--text-2); }
    .search-clear[hidden] { display: none; }
    .meta { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; margin: -8px 0 18px; flex-wrap: wrap; }
    .live { display: inline-flex; align-items: center; gap: 6px; }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }

    /* cards */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 0; flex-wrap: wrap; }
    .card-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
    .card-body { padding: 16px 20px 20px; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    @media (min-width: 1280px) { .kpis { grid-template-columns: repeat(7, minmax(0, 1fr)); } .kpi { padding: 16px; } .kpi-value { font-size: 30px; } }
    .kpi { padding: 16px 18px; transition: transform .15s, box-shadow .15s; }
    .kpi:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .kpi-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 7px; }
    .kpi-value { font-size: 32px; font-weight: 800; letter-spacing: -.04em; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
    .kpi-cap { font-size: 12px; color: var(--muted-2); min-height: 18px; }
    .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }

    .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .grid > .card, .kpis > .card { min-width: 0; }

    /* chart */
    .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart { position: relative; width: 100%; overflow: hidden; }
    .chart svg { display: block; width: 100%; max-width: 100%; }
    .chart .axis { fill: var(--muted-2); font-size: 11px; }
    .chart .grid-line { stroke: var(--line-soft); }
    .tooltip {
      position: absolute; left: 0; top: 0; pointer-events: none; background: #111827; color: #f9fafb; border-radius: 10px; padding: 8px 10px;
      font-size: 12px; line-height: 1.45; white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 10;
    }
    .tooltip b { font-weight: 600; }

    /* table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-align: right; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    td { padding: 12px; text-align: right; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
    tbody tr { cursor: pointer; transition: background .12s; }
    tbody tr:hover { background: #f8fafc; }
    tfoot td { font-weight: 700; border-bottom: 0; }
    .source-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--brand-soft); width: 72px; vertical-align: middle; margin-left: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }

    /* people */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab {
      border: 1px solid var(--line); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 6px 12px;
      cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s, color .15s;
    }
    .tab:hover { border-color: #cbd5e1; }
    .tab.active { background: var(--text); border-color: var(--text); color: #fff; }
    .tab em { font-style: normal; opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .search { height: 36px; border: 1px solid var(--line); border-radius: 10px; padding: 0 36px 0 12px; font: inherit; min-width: 220px; outline: none; -webkit-appearance: none; appearance: none; }
    .search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .people { list-style: none; margin: 0; padding: 0; }
    .person { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 11px 2px; border-bottom: 1px solid var(--line-soft); }
    .person:last-child { border-bottom: 0; }
    .person-name { font-weight: 600; text-decoration: none; }
    a.person-name:hover { color: var(--brand); text-decoration: underline; }
    .person-sub { color: var(--muted); font-size: 12px; grid-column: 1; }
    .person-when { color: var(--muted); font-size: 12px; text-align: right; grid-row: 1 / span 2; grid-column: 2; align-self: center; font-variant-numeric: tabular-nums; }
    .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); margin-right: 6px; }
    .more { margin-top: 12px; width: 100%; height: 38px; border: 1px dashed var(--line); background: var(--surface-2); border-radius: 10px; cursor: pointer; color: var(--text-2); }
    .empty { color: var(--muted); text-align: center; padding: 28px 0; }

    .warning { background: var(--amber-soft); color: #92400e; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
    .loading .kpi-value, .loading .chart, .loading .table-wrap, .loading .people { opacity: .35; transition: opacity .2s; }
    .skeleton { display: inline-block; width: 64px; height: 30px; border-radius: 8px; background: linear-gradient(90deg, #eef0f3, #f6f7f9, #eef0f3); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* tablets and phones: sources become one scrollable strip at the top */
    @media (max-width: 900px) {
      .app { grid-template-columns: minmax(0, 1fr); }
      .sidebar {
        min-width: 0; position: sticky; top: 0; z-index: 5; height: auto; flex-direction: row; align-items: center; gap: 8px;
        padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
      }
      .brand { padding: 0; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-text, .nav-title, .nav-count { display: none; }
      #sources { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      #sources::-webkit-scrollbar { display: none; }
      .nav-item { width: auto; white-space: nowrap; padding: 8px 11px; }
      .sidebar-foot { margin: 0; border: 0; padding: 0; flex: none; }
      .main { padding: 20px max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      h1 { font-size: 22px; }
      .topbar { margin-bottom: 16px; }
      .periods { width: 100%; }
      .segmented { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
      .segmented button { padding: 9px 4px; }
      .range { width: 100%; }
      .dates { width: 100%; height: 42px; }
      .dates .chevron { margin-left: auto; }
      .search { font-size: 16px; }  /* no zoom on focus in iOS Safari */
      .search-wrap { width: 100%; }
      .kpis { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .kpi { padding: 14px; }
      .kpi-value { font-size: 26px; }
      .card-head { padding: 16px 16px 0; }
      .card-body { padding: 14px 16px 16px; }
      .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { white-space: nowrap; flex: none; }
      .search { min-width: 0; width: 100%; height: 40px; }
    }

    /* phones: the sources table turns into cards, the calendar becomes a bottom sheet */
    @media (max-width: 640px) {
      .backdrop:not([hidden]) { display: block; }
      .picker {
        position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; border-radius: 22px 22px 0 0;
        padding: 10px 16px max(16px, env(safe-area-inset-bottom)); animation: sheet .22s cubic-bezier(.2,.8,.2,1);
      }
      .picker::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
      .picker-months { justify-content: center; }
      .month { width: 100%; max-width: 420px; }
      .weekdays, .days { grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .day { height: 44px; font-size: 15px; }
      .picker-actions { width: 100%; }
      .picker-actions .btn { flex: 1; height: 44px; }
      .sources-table, .sources-table tbody, .sources-table tfoot, .sources-table tr, .sources-table td { display: block; }
      .sources-table thead { display: none; }
      .sources-table tr {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px;
        border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
      }
      .sources-table tfoot tr { background: var(--surface-2); margin-bottom: 0; }
      .sources-table td { border: 0; padding: 0; text-align: left; white-space: normal; font-size: 15px; font-weight: 600; }
      .sources-table td::before {
        content: attr(data-label); display: block; font-size: 10.5px; font-weight: 600; color: var(--muted);
        text-transform: uppercase; letter-spacing: .04em; margin-bottom: 1px;
      }
      .sources-table td:first-child { grid-column: 1 / -1; font-size: 15px; }
      .sources-table td:first-child::before { display: none; }
      .sources-table .bar { display: block; width: 100%; margin: 6px 0 0; }
      .table-wrap { overflow: visible; }
      .card-head { flex-direction: column; align-items: stretch; }
      .legend { gap: 10px; }
    }

    /* small phones */
    @media (max-width: 380px) {
      .segmented button { font-size: 13px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kpi { padding: 12px; }
      .kpi-label { font-size: 11px; }
      .kpi-value { font-size: 22px; }
      .sources-table tr { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* big screens */
    @media (min-width: 1800px) {
      body { font-size: 15px; }
      .kpi-value { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">ОКВ</div>
        <div class="brand-text">
          <div class="brand-name">Аналитика лидов</div>
          <div class="brand-sub">Общество красивых волос</div>
        </div>
      </div>
      <div class="nav-title">Источники</div>
      <nav id="sources"></nav>
      <div class="sidebar-foot">
        <button class="logout" id="logout">Выйти</button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="topbar">
        <div>
          <h1 id="title">Все источники</h1>
          <div class="subtitle" id="subtitle">Сообщения в ВКонтакте и записи в YCLIENTS</div>
        </div>
        <div class="periods">
          <div class="segmented" id="presets">
            <button data-preset="today">Сегодня</button>
            <button data-preset="yesterday">Вчера</button>
            <button data-preset="7d">7 дней</button>
            <button data-preset="30d">30 дней</button>
            <button data-preset="month">Этот месяц</button>
            <button data-preset="prev">Прошлый</button>
          </div>
          <div class="range">
            <button class="dates" id="range-button" type="button" aria-haspopup="dialog" aria-expanded="false">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              <span id="range-label"></span>
              <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="picker" id="picker" role="dialog" aria-label="Выбор периода" hidden></div>
          </div>
        </div>
      </div>
      <div class="meta"><span class="live" id="updated">Загрузка…</span><span id="period-label"></span></div>
      <div id="warnings"></div>

      <section class="kpis" id="kpis"></section>

      <div class="grid">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title" id="chart-title">Лиды и записи по дням</h2>
            <div class="legend">
              <span><i class="swatch" style="background:var(--brand)"></i>Новые лиды</span>
              <span><i class="swatch" style="background:var(--base)"></i>Лиды из базы</span>
              <span><i class="swatch" style="background:var(--green);border-radius:50%"></i>Записи</span>
            </div>
          </div>
          <div class="card-body"><div class="chart" id="chart"></div></div>
        </section>

        <section class="card" id="sources-card">
