<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход · Аналитика лидов</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f6; --surface: #fff; --line: #e8eaed; --text: #111827; --muted: #6b7280;
      --brand: #3d5a80; --brand-hover: #2d4a6f; --red: #dc2626;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font: 14px/1.5 var(--font); color: var(--text);
      background: radial-gradient(1200px 600px at 20% -10%, #dfe7f2 0%, transparent 60%), var(--bg);
    }
    .card {
      width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 20px; padding: 32px; box-shadow: 0 24px 64px rgba(16,24,40,.08);
    }
    .mark {
      width: 44px; height: 44px; border-radius: 12px; background: #1e293b; color: #f8fafc;
      display: grid; place-items: center; font-weight: 800; letter-spacing: -.02em; margin-bottom: 20px;
    }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    input {
      width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
      font: inherit; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px #eef2f7; }
    button {
      width: 100%; height: 44px; margin-top: 16px; border: 0; border-radius: 12px; background: var(--brand);
      color: #fff; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; transition: background .15s;
    }
    button:hover { background: var(--brand-hover); }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: var(--red); font-size: 13px; min-height: 20px; margin-top: 10px; }
  </style>
</head>
<body>
  <form class="card" id="form" novalidate>
    <div class="mark">ОКВ</div>
    <h1>Аналитика лидов</h1>
    <p>Общество красивых волос</p>
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" autofocus>
    <button id="submit" type="submit">Войти</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const API_BASE = location.hostname.endsWith("github.io") ? "https://analytics.138-124-231-240.nip.io" : "";
    const form = document.getElementById("form");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("submit");
      const error = document.getElementById("error");
      if (!document.getElementById("password").value) { error.textContent = "Введите пароль"; return; }
      button.disabled = true;
      error.textContent = "";
      try {
        const response = await fetch(API_BASE + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: API_BASE ? "omit" : "same-origin",
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        if (response.ok) {
          const data = await response.json();
          try { localStorage.setItem("mark_token", data.token); } catch (e) { /* storage blocked: the cookie still works on the server */ }
          location.href = "./";
          return;
        }
        error.textContent = "Неверный пароль";
      } catch (e) {
        error.textContent = "Нет связи с сервером";
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
